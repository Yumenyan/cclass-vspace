<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1621">
<title>C組仮想空間</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Outfit:wght@500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e1621;--glass:rgba(14,22,33,.6);--line:rgba(255,255,255,.16);--acc:#4cc9b0;--acc2:#5b8def;--fg:#f2f6fa;--mut:#9fb0c0;--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px);font-family:'Noto Sans JP',system-ui,sans-serif}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--fg);touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:22px;line-height:1;display:inline-block;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga';-webkit-font-feature-settings:'liga';vertical-align:middle}
.glass{background:var(--glass);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);border:1px solid var(--line);box-shadow:0 10px 34px rgba(0,0,0,.28)}
button{font:inherit;color:inherit;cursor:pointer;border:0}
input,textarea{font:inherit;color:var(--fg);user-select:text;-webkit-user-select:text}
.btn{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#06121c;font-weight:700;border-radius:12px;padding:12px 18px;width:100%}
.btn.sub{background:rgba(255,255,255,.1);color:var(--fg);font-weight:500}
.btn:disabled{opacity:.5}
.fld{width:100%;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:5px 0;outline:none}.fld:focus{border-color:var(--acc)}
.ib{height:42px;min-width:42px;padding:0 10px;border-radius:14px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:4px;position:relative}
.ib.on{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#06121c}.ib em{font-style:normal;font-size:12px;font-weight:700}
#gate{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 80% at 20% 0%,rgba(91,141,239,.35),transparent 60%),radial-gradient(100% 80% at 100% 100%,rgba(76,201,176,.28),transparent 55%),rgba(8,14,22,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.card{width:min(380px,92vw);padding:28px 24px;border-radius:24px}
.logo{font-family:Outfit,'Noto Sans JP',sans-serif;font-weight:700;font-size:34px;letter-spacing:.02em;line-height:1.1}.logo small{display:block;font-family:'Noto Sans JP';font-weight:500;font-size:12px;color:var(--mut);letter-spacing:.2em;margin-top:8px}
.card .btn{margin-top:10px}#er{min-height:1.3em;color:#ffb4b4;font-size:13px;margin-top:6px}.note{color:var(--mut);font-size:11.5px;margin-top:10px;line-height:1.5}
#brand{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));top:calc(10px + var(--top));z-index:5;padding:9px 14px;border-radius:14px;font-family:Outfit,'Noto Sans JP',sans-serif;font-weight:700;display:flex;gap:8px;align-items:baseline}#brand span{font-family:'Noto Sans JP';font-weight:500;font-size:12px;color:var(--mut)}
#loc{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + var(--top));z-index:5;padding:9px 16px;border-radius:999px;display:flex;gap:6px;align-items:center;font-weight:500;font-size:14px;max-width:44vw;white-space:nowrap}#loc .ms{font-size:18px;color:var(--acc)}
#tools{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));top:calc(10px + var(--top));z-index:5;display:flex;gap:8px}
#stat{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));top:calc(60px + var(--top));z-index:4;font-size:11px;color:var(--mut);display:flex;gap:6px;align-items:center}#stat i{width:8px;height:8px;border-radius:50%;background:#e6b94c}#stat[data-s=ok] i{background:#4cc9b0}#stat[data-s=err] i,#stat[data-s=full] i{background:#e65c5c}
body.guest .mem{display:none!important}
#js{position:fixed;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(26px + var(--bot));width:128px;height:128px;border-radius:50%;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.35);z-index:5;touch-action:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}#js i{position:absolute;left:44px;top:44px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.7);box-shadow:0 4px 14px rgba(0,0,0,.3)}
#act{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(34px + var(--bot));z-index:6;padding:13px 22px;border-radius:999px;font-weight:700;font-size:15px;display:flex;gap:10px;align-items:center}#act kbd{font:700 12px Outfit,sans-serif;background:rgba(255,255,255,.2);border-radius:6px;padding:2px 7px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--bot));z-index:8;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}.toast{padding:9px 16px;border-radius:12px;font-size:13px;animation:tin .25s}@keyframes tin{from{opacity:0;transform:translateY(8px)}}
#chat{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));top:calc(62px + var(--top));width:min(350px,calc(100vw - 24px));height:min(300px,38vh);z-index:5;border-radius:18px;display:none;flex-direction:column;padding:10px}#chat.open{display:flex}
#log{flex:1;overflow:auto;font-size:13px;line-height:1.5;user-select:text;-webkit-user-select:text}.m b{color:var(--acc);margin-right:6px;font-weight:700}.m.sys{color:var(--mut);font-size:12px}.m.me b{color:var(--acc2)}
#cf{display:flex;gap:6px;margin-top:8px}#cf .fld{margin:0;padding:9px 12px}#cf button{border-radius:12px;padding:0 12px;background:var(--acc);color:#06121c}
#ring .rb{position:fixed;z-index:4;width:40px;height:40px;border-radius:50%;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:19px;display:flex;align-items:center;justify-content:center;padding:0;opacity:.92}#ring .rb.on{background:var(--acc);color:#06121c}
#pop{position:fixed;inset:0;z-index:15;background:rgba(5,10,16,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.pc{width:min(460px,100%);max-height:80vh;border-radius:22px;display:flex;flex-direction:column;overflow:hidden}.ph{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}.ph h3{margin:0;font-family:Outfit,'Noto Sans JP',sans-serif;font-size:19px}.pb{padding:6px 18px 18px;overflow:auto;line-height:1.7;font-size:14px;user-select:text;-webkit-user-select:text}.pb ul{padding-left:18px;margin:6px 0}.mut{color:var(--mut);font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent}.sw.sel{border-color:#fff}
.pl{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
@media(max-width:600px){#brand span{display:none}#loc{max-width:34vw;font-size:13px}#chat{top:calc(60px + var(--top))}}
</style></head><body class="guest">
<canvas id="c"></canvas>
<div id="hud" hidden>
 <div id="brand" class="glass">C組<span>仮想空間</span></div>
 <div id="loc" class="glass"><span class="ms">location_on</span><span id="locn">中央庭園</span></div>
 <div id="tools">
  <button id="bPeople" class="ib mem"><span class="ms">group</span><em id="pc">1</em></button>
  <button id="bMic" class="ib mem"><span class="ms">mic_off</span></button>
  <button id="bChat" class="ib mem"><span class="ms">chat</span></button>
  <button id="bMode" class="ib"><span class="ms">map</span></button>
  <button id="bSet" class="ib mem"><span class="ms">settings</span></button>
 </div>
 <div id="stat" class="mem" data-s="wait"><i></i><span id="statt">接続中…</span></div>
 <div id="chat" class="glass mem"><div id="log"></div><div id="cf"><input id="ci" class="fld" maxlength="200" placeholder="メッセージを入力" autocomplete="off"><button id="cs"><span class="ms">send</span></button></div></div>
 <div id="ring" class="mem"></div>
 <div id="js"><i></i></div>
 <button id="act" class="glass" hidden><kbd>E</kbd><span id="actl"></span></button>
 <div id="toasts"></div>
</div>
<div id="pop" hidden></div>
<div id="gate"><div class="card glass">
 <div class="logo">C組<br>仮想空間<small>CLASS C VIRTUAL SPACE</small></div>
 <div style="height:14px"></div>
 <input id="uid" class="fld" placeholder="アカウントID" autocapitalize="off" autocomplete="username" spellcheck="false">
 <input id="pw" class="fld" type="password" placeholder="パスワード" autocapitalize="off" autocomplete="current-password">
 <button id="lg" class="btn">ログイン</button>
 <button id="gs" class="btn sub">ゲストで見る</button>
 <div id="er"></div>
 <div class="note">ログイン情報はこの端末に保存され、次回から自動でログインします。ゲストは閲覧のみで、チャット・通話・個人部屋は使えません。</div>
</div></div>
